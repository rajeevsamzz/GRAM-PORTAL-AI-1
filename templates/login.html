{% extends "base.html" %}


{% block content %}


<div class="card form">

    <h2>
        Login
    </h2>


    <form method="post">


        <input
            name="email"
            type="text"
            placeholder="Username or email"
            required
        >


        <input
            name="password"
            type="password"
            placeholder="Password"
            required
        >


        <button>
            Login
        </button>


    </form>

</div>


{% endblock %}
