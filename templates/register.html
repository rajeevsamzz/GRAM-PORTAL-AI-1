{% extends "base.html" %}


{% block content %}


<div class="card form">


    <h2>
        Create Citizen Account
    </h2>


    <form method="post">


        <input
            name="name"
            placeholder="Full name"
            required
        >


        <input
            name="email"
            type="email"
            placeholder="Email"
            required
        >


        <input
            name="password"
            type="password"
            placeholder="Password"
            required
        >


        <button>
            Register
        </button>


    </form>


</div>


{% endblock %}
